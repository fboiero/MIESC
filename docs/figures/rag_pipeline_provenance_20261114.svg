<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif" role="img" aria-label="MIESC's RAG and false-positive pipeline. A finding plus code context queries an embedding RAG over 93 EVM/Solidity vulnerability documents keyed by SWC and CWE, which grounds LLM reasoning and feeds a false-positive filter combining pattern rules and RAG validation, producing a grounded context and a false-positive verdict. Two gaps are marked: the knowledge base is EVM-only with no chain field, and the trainable false-positive classifier ships no trained model and falls back to a heuristic.">
  <rect x="0" y="0" width="1040" height="520" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="520" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0a3069">RAG grounding &amp; false-positive filtering — and two provenance gaps</text>
  <text x="520" y="60" text-anchor="middle" font-size="12" fill="#57606a">the knowledge base grounds LLM reasoning and validates findings; both halves are EVM-coupled today</text>

  <!-- input -->
  <rect x="40" y="120" width="150" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="115" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a3069">Finding</text>
  <text x="115" y="171" text-anchor="middle" font-size="11" fill="#0a3069">+ code context</text>
  <text x="115" y="188" text-anchor="middle" font-size="11" fill="#0a3069">(type, SWC, snippet)</text>

  <!-- embedding RAG -->
  <rect x="235" y="110" width="250" height="100" rx="8" fill="#eafaf0" stroke="#2da44e" stroke-width="1.6"/>
  <text x="360" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">Embedding RAG</text>
  <text x="360" y="161" text-anchor="middle" font-size="11.5" fill="#1a7f37">93 vuln documents</text>
  <text x="360" y="178" text-anchor="middle" font-size="11.5" fill="#1a7f37">SWC / CWE keyed · source-tier</text>
  <text x="360" y="195" text-anchor="middle" font-size="11.5" fill="#1a7f37">semantic + metadata filter</text>

  <!-- FP filter -->
  <rect x="530" y="110" width="230" height="100" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
  <text x="645" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#24292f">False-positive filter</text>
  <text x="645" y="161" text-anchor="middle" font-size="11.5" fill="#57606a">pattern rules + RAG check</text>
  <text x="645" y="178" text-anchor="middle" font-size="11.5" fill="#57606a">+ ML classifier</text>
  <text x="645" y="195" text-anchor="middle" font-size="11.5" fill="#57606a">(heuristic fallback)</text>

  <!-- outputs -->
  <rect x="808" y="110" width="192" height="46" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="904" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#0a3069">Grounded LLM context</text>
  <rect x="808" y="164" width="192" height="46" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="904" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0a3069">FP verdict + reason</text>

  <!-- arrows -->
  <line x1="190" y1="160" x2="233" y2="160" stroke="#57606a" stroke-width="1.8"/>
  <polygon points="233,160 221,155 221,165" fill="#57606a"/>
  <line x1="485" y1="160" x2="528" y2="160" stroke="#57606a" stroke-width="1.8"/>
  <polygon points="528,160 516,155 516,165" fill="#57606a"/>
  <line x1="760" y1="133" x2="806" y2="133" stroke="#57606a" stroke-width="1.8"/>
  <polygon points="806,133 794,128 794,138" fill="#57606a"/>
  <line x1="760" y1="187" x2="806" y2="187" stroke="#57606a" stroke-width="1.8"/>
  <polygon points="806,187 794,182 794,192" fill="#57606a"/>

  <!-- Gap 1 -->
  <rect x="235" y="258" width="250" height="86" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
  <text x="360" y="283" text-anchor="middle" font-size="12.5" font-weight="700" fill="#953800">Gap 1 — EVM-only KB</text>
  <text x="360" y="303" text-anchor="middle" font-size="11" fill="#953800">no `chain` field, no invariant</text>
  <text x="360" y="319" text-anchor="middle" font-size="11" fill="#953800">provenance; FP rules hardcode</text>
  <text x="360" y="335" text-anchor="middle" font-size="11" fill="#953800">pragma / OZ / Chainlink</text>
  <line x1="360" y1="210" x2="360" y2="256" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- Gap 2 -->
  <rect x="530" y="258" width="230" height="86" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
  <text x="645" y="283" text-anchor="middle" font-size="12.5" font-weight="700" fill="#953800">Gap 2 — no shipped model</text>
  <text x="645" y="303" text-anchor="middle" font-size="11" fill="#953800">trainable FP classifier has</text>
  <text x="645" y="319" text-anchor="middle" font-size="11" fill="#953800">no weights; silent heuristic</text>
  <text x="645" y="335" text-anchor="middle" font-size="11" fill="#953800">fallback overstates capability</text>
  <line x1="645" y1="210" x2="645" y2="256" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- planned fix -->
  <rect x="235" y="392" width="525" height="72" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="497" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#6639ba">Planned (M3) — additive, EVM-safe</text>
  <text x="497" y="439" text-anchor="middle" font-size="11.5" fill="#6639ba">`chain` field + invariant provenance (metadata + optional filter; no re-embedding)</text>
  <text x="497" y="456" text-anchor="middle" font-size="11.5" fill="#6639ba">chain-aware FP guard · ship FP model with provenance card, or document the heuristic</text>
</svg>
